<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>makers.si – la bibliothèque de la communauté</title>
  <meta name="description" content="makers.si : skills Claude, prompts, idées, sondages et PDF partagés par la communauté des vibe codeurs et de l’IA. Chaque partage est relu avant publication.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#000000">
  <!-- La même politique de sécurité que celle posée par le serveur, mais écrite
       dans la page. Sans elle, la copie publiée tournait sans aucune protection :
       GitHub Pages ne pose pas d'en-tête, et toute la défense du site tient dans
       cette ligne-là. `frame-ancestors` est le seul morceau qui ne marche qu'en
       en-tête : un hébergeur de fichiers ne peut donc pas empêcher qu'on affiche
       le site dans le cadre d'un autre. C'est connu et assumé tant que la copie
       publiée ne sait rien écrire. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'self'">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <!-- Sans cette ligne, le manifeste existait mais aucun navigateur ne le lisait :
       le site n'était pas installable, malgré ses icônes et son service worker. -->
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Plus aucune police n'est téléchargée : le site écrit avec celle de
       l'appareil (San Francisco sur iPhone et Mac, Roboto sur Android, Segoe UI
       sur Windows). Six fichiers et 115 Ko de moins avant la première ligne de
       texte — et le texte s'affiche à la première image, sans attendre. -->
  <link rel="stylesheet" href="style.css">
  <!-- Le thème est posé avant le premier affichage, sinon on verrait un éclair
       de nuit avant de passer au papier. Un fichier, pas une balise en ligne :
       la politique de sécurité du site refuse les scripts écrits dans le HTML. -->
  <script type="module" src="theme.js"></script>
  <link rel="canonical" href="https://aimadbouzid.github.io/makers/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="makers.si">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:title" content="makers.si – la bibliothèque de la communauté">
  <meta property="og:description" content="Des skills Claude prêts à installer, des prompts testés, des idées, des PDF et des liens choisis. Chaque partage est relu avant publication.">
  <meta property="og:url" content="https://aimadbouzid.github.io/makers/">
  <meta property="og:image" content="https://aimadbouzid.github.io/makers/icons/icone-512.png">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>

  <!-- Le rail existe sur toutes les pages : on change de catégorie depuis la
       page d'un partage, depuis un formulaire, depuis l'administration. -->
  <nav id="rail" class="rail" aria-label="Sections de la bibliothèque"></nav>
  <div class="voile" aria-hidden="true"></div>
  <div id="view" class="wrap"></div>
  <footer class="site-footer">
    <div class="foot">
      <span class="logo">makers<i>.</i>si</span>
      <nav aria-label="Informations légales">
        <a href="#/aide">Aide</a>

    </div>
  </footer>
  <!-- Sur un téléphone, les quatre destinations qu'on atteint vraiment au doigt. -->
  <nav id="barre-bas" class="barre-bas" aria-label="Accès rapide"></nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="statique.js"></script>
  <script type="module" src="app.js"></script>
  <!-- La palette de commandes et le clavier. Si ce fichier manque, le site
       fonctionne exactement comme sans lui : rien ici n'est indispensable. -->
  <script type="module" src="atelier.js"></script>
</body>
</html>
